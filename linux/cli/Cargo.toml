[package]
name = "rawaccel-cli"
version = "1.7.0"
edition = "2021"
rust-version = "1.74"
description = "Command-line client for the rawaccel-agentd unix-socket control plane"
license = "MIT"

[[bin]]
name = "rawaccel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
