# Builds wrapper + common and runs wrapper-tests (user-mode, no IOCTL/driver load).
name: windows-ci

on:
  push:
    branches: ["**"]
    paths: ["common/**", "wrapper/**", "wrapper-deps/**", "wrapper-tests/**", "RawAccel.Contracts/**", ".github/workflows/windows-ci.yml"]
  pull_request:
    paths: ["common/**", "wrapper/**", "wrapper-deps/**", "wrapper-tests/**", "RawAccel.Contracts/**", ".github/workflows/windows-ci.yml"]
  workflow_dispatch:

jobs:
  wrapper-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Restore NuGet (legacy packages.config)
        run: nuget restore rawaccel.sln
      # Build via the solution, not the csproj: the C# test project is AnyCPU but its
      # C++/CLI dependency is x64-only. Only the .sln's per-project platform mapping
      # (solution x64 -> wrapper-tests AnyCPU, wrapper x64) reconciles them. Targeting
      # wrapper-tests pulls in wrapper/wrapper-deps but skips the WDK-only driver.
      - name: Build wrapper-tests (x64)
        # wrapper-tests lives in the "Tests" solution folder, so its metaproj target is
        # "Tests\wrapper-tests". Bare names cascade MSB4057 on VS2019 16.10+, and the
        # metaproj exposes no :Build, so select it with the SolutionFolder\Project:Rebuild form.
        run: msbuild rawaccel.sln "/t:Tests\wrapper-tests:Rebuild" /p:Configuration=Release /p:Platform=x64 /m
      - name: MSTest suite
        # vstest.console.exe is not on PATH (setup-msbuild only adds msbuild); locate it via vswhere.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found" }
          & $vstest wrapper-tests\bin\Release\wrapper-tests.dll /Platform:x64
