# Builds wrapper + common and runs wrapper-tests (user-mode, no IOCTL/driver load).
name: windows-ci

on:
  push:
    branches: ["**"]
    paths: ["common/**", "wrapper/**", "wrapper-deps/**", "wrapper-tests/**", "RawAccel.Contracts/**", ".github/workflows/windows-ci.yml"]
  pull_request:
    paths: ["common/**", "wrapper/**", "wrapper-deps/**", "wrapper-tests/**", "RawAccel.Contracts/**", ".github/workflows/windows-ci.yml"]
  workflow_dispatch:

jobs:
  wrapper-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Restore NuGet (legacy packages.config)
        run: nuget restore rawaccel.sln
      # Build via the solution, not the csproj: the C# test project is AnyCPU but its
      # C++/CLI dependency is x64-only. Only the .sln's per-project platform mapping
      # (solution x64 -> wrapper-tests AnyCPU, wrapper x64) reconciles them. Targeting
      # wrapper-tests pulls in wrapper/wrapper-deps but skips the WDK-only driver.
      - name: Build wrapper-tests (x64)
        run: msbuild rawaccel.sln /t:wrapper-tests /p:Configuration=Release /p:Platform=x64 /m
      - name: MSTest suite
        run: vstest.console.exe wrapper-tests\bin\Release\wrapper-tests.dll /Platform:x64
