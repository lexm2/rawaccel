# Cross-distro CI for the Linux HID-BPF agent.
#
# The BPF program uses the struct_ops HID-BPF API (hid_bpf_ops / hid_device_event),
# which only exists on Linux >= 6.11 with CONFIG_HID_BPF=y. A true multi-kernel
# load-verify needs HID-BPF-enabled kernels; the readily-available prebuilt CI
# kernel images (cilium/ci-kernels) are built WITHOUT CONFIG_HID_BPF, so they can't
# load our program. Until an HID-BPF kernel source is wired in (self-hosted runner
# or custom-built kernels), cross-kernel verification is covered by `rawaccel
# doctor` + real-hardware testing. CI here validates: the build on each distro, and
# a best-effort real verifier load on the runner's own kernel (skipped if it lacks
# HID-BPF). See the runner-verify step in build-and-test.
name: linux-ci

on:
  push:
    branches: ["**"]
    paths: ["linux/**", "common/**", "userinterface/**", "userspace-backend/**", ".github/workflows/linux-ci.yml"]
  pull_request:
    paths: ["linux/**", "common/**", "userinterface/**", "userspace-backend/**", ".github/workflows/linux-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # 1) Build everything, run the unprivileged suite, and attempt a real verifier
  #    load on the runner's own kernel (best-effort: skipped if it lacks HID-BPF).
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang llvm libbpf-dev pkg-config \
            libsystemd-dev nlohmann-json3-dev build-essential linux-tools-generic
          # noble has no standalone bpftool (virtual pkg); the shim can't match the
          # Azure runner kernel, so symlink the generic linux-tools binary onto PATH.
          sudo ln -sf "$(find /usr/lib/linux-tools* -name bpftool 2>/dev/null | sort | tail -1)" /usr/local/bin/bpftool
          bpftool version
      - uses: dtolnay/rust-toolchain@stable
      - name: Core tests (cargo + ctest + parity, no root)
        run: ./linux/run-tests.sh --core
      - name: Preflight doctor smoke (non-gating; runner kernel may predate 6.11)
        run: |
          cargo build --manifest-path linux/Cargo.toml -p rawaccel-agentd
          sudo linux/target/debug/rawaccel-agentd --doctor \
            --bpf-object linux/build/rawaccel.bpf.o || true
      - name: BPF verifier load on runner kernel
        # Real load through the libbpf verifier on the runner's kernel. Gates on a
        # genuine verifier rejection, but PASSES on exit 77 (skip), which the tool
        # returns when the kernel lacks HID-BPF/CAP_BPF -- expected on most runners.
        # This is the one real load datapoint until HID-BPF test kernels are wired in.
        run: |
          set +e
          sudo linux/build/rawaccel-bpf-verify --object linux/build/rawaccel.bpf.o
          code=$?
          if [ "$code" -eq 77 ]; then
            echo "::notice::runner kernel lacks HID-BPF or CAP_BPF; verifier load skipped"
            exit 0
          fi
          exit "$code"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - name: Build .NET GUI + userspace backend (net8.0)
        run: |
          dotnet build userspace-backend/userspace-backend.csproj -c Release
          dotnet build userinterface/userinterface.csproj -c Release
          dotnet test userspace-backend-tests/userspace-backend-tests.csproj -c Release

  # 2) Distro build matrix -- catches per-distro toolchain/dependency drift
  #    (libbpf/clang/bpftool versions, package names). BUILD ONLY: containers share
  #    the host kernel, so no BPF load happens here. /sys/kernel/btf/vmlinux from the
  #    runner is mounted read-only, which is enough to generate vmlinux.h.
  distro-build:
    runs-on: ubuntu-24.04
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:latest
            install: dnf -y install cmake clang llvm bpftool libbpf-devel pkgconf-pkg-config systemd-devel nlohmann-json-devel rust cargo gcc-c++ make
          - distro: archlinux:latest
            install: pacman -Sy --noconfirm cmake clang llvm bpf libbpf pkgconf systemd nlohmann-json rust make gcc
          # ca-certificates first + explicit update-ca-certificates: the minimal
          # base images ship no CA bundle, and installing it in the same --no-
          # install-recommends transaction as everything else doesn't reliably
          # generate /etc/ssl/certs/ca-certificates.crt, so the distro cargo's
          # HTTPS fetch of crates.io fails ([77] SSL CA cert).
          - distro: debian:trixie
            install: apt-get update && apt-get install -y --no-install-recommends ca-certificates && update-ca-certificates && apt-get install -y --no-install-recommends cmake clang llvm bpftool libbpf-dev pkg-config libsystemd-dev nlohmann-json3-dev rustc cargo build-essential
          # Ubuntu 24.04 LTS ships cargo 1.75, too old for the dep tree (clap pulls
          # edition2024, needs cargo >= 1.85), so the Rust side builds via rustup
          # instead (see the conditional build step). The C++/BPF build still uses
          # the distro toolchain, which is the real cross-distro signal here.
          - distro: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends ca-certificates && update-ca-certificates && apt-get install -y --no-install-recommends cmake clang llvm libbpf-dev pkg-config libsystemd-dev nlohmann-json3-dev build-essential linux-tools-generic curl
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: ${{ matrix.install }}
      - name: Ensure bpftool on PATH
        # Ubuntu's linux-tools-common installs a /usr/sbin/bpftool SHIM that
        # dispatches to the running kernel's tools (absent in a container), so it's
        # on PATH but non-functional. Test that bpftool actually RUNS, not just that
        # the name resolves; if not, symlink the real linux-tools binary (which
        # /usr/local/bin shadows ahead of the shim). No-op on Fedora/Arch/Debian.
        run: |
          if ! bpftool version >/dev/null 2>&1; then
            ln -sf "$(find /usr/lib/linux-tools* -name bpftool 2>/dev/null | sort | tail -1)" /usr/local/bin/bpftool
            hash -r
          fi
          bpftool version
      - name: Build C++ artifacts + BPF object
        run: |
          cmake -S linux -B linux/build
          cmake --build linux/build -j
      - name: Build Rust daemon + CLI (distro cargo)
        # Fedora/Arch/Debian ship cargo >= 1.85, which the dep tree requires.
        if: ${{ !startsWith(matrix.distro, 'ubuntu') }}
        run: cargo build --release --manifest-path linux/Cargo.toml
      - name: Build Rust daemon + CLI (rustup stable)
        # Ubuntu LTS cargo is too old; use the current stable toolchain instead.
        if: ${{ startsWith(matrix.distro, 'ubuntu') }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo build --release --manifest-path linux/Cargo.toml
